[dbservers]
db ansible_host=192.168.56.10

[backendservers]
backend1 ansible_host=192.168.56.11
backend2 ansible_host=192.168.56.13

[frontendservers]
frontend ansible_host=127.0.0.1 ansible_connection=local

[webservers:children]
backendservers
frontendservers

[all:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=/tmp/insecure_private_key
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
---
- name: Clone app source repository
  ansible.builtin.git:
    repo: 'https://github.com/dishua/DevOpsProject-UserStory.git'
    dest: /opt/userstory
    version: master
    force: yes

- name: Wait for backend nodes
  ansible.builtin.wait_for:
    host: "{{ item }}"
    port: 8080
    state: started
    delay: 2
    timeout: 30
  loop:
    - "{{ BACKEND1_IP }}"
    - "{{ BACKEND2_IP }}"

- name: Render Nginx Load Balancer config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /opt/userstory/frontend/nginx.conf
    mode: '0644'

- name: Build React Frontend Docker image
  community.docker.docker_image:
    name: userstory-frontend
    build:
      path: /opt/userstory/frontend
      dockerfile: ../devops/Docker/config/frontend.Dockerfile
      args:
        BACKEND_URL: "/api"
    source: build

- name: Run Frontend Load Balancer Docker Container
  community.docker.docker_container:
    name: userstory-frontend
    image: userstory-frontend:latest
    restart_policy: unless-stopped
    docker_host: "unix://var/run/docker.sock"
    recreate: true
    published_ports:
      - "80:80"
    volumes:
      - /opt/userstory/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

- name: Ensure Frontend Nginx is responding on port 80
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 80
    state: started
    delay: 2
    timeout: 20
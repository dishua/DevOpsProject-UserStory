name: userstory

services:
  db:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: userstory
      MARIADB_USER: ${DB_USERSTORYPROJ_USER}
      MARIADB_PASSWORD: ${DB_USERSTORYPROJ_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ${PROJECT_DIR}/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh","--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  backend:
    build: 
      context: ${PROJECT_DIR}/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_USERSTORYPROJ_URL: jdbc:mariadb://db:3306/userstory
      DB_USERSTORYPROJ_USER: ${DB_USERSTORYPROJ_USER}
      DB_USERSTORYPROJ_PASSWORD: ${DB_USERSTORYPROJ_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: 
      context: ${PROJECT_DIR}/frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://localhost:8080
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mariadb_data:
